# LCKED — Render Blueprint
# ============================================================
# Deploy LCKED to Render with this blueprint.
#
# Usage:
#   1. Push this repo to GitHub
#   2. In Render: New → Blueprint → select this repo
#   3. Render reads render.yaml and creates the service
#   4. (Optional) Set environment variables in Render dashboard
#
# The app is a local-first password manager — all encryption happens in
# the browser (Web Crypto API). The server only serves static files +
# the API routes used for optional Firebase cloud sync.
#
# NOTE: Node.js version is pinned via .nvmrc (Node 20) — Render reads
# it automatically. No nodeVersion field needed here.

services:
  - type: web
    name: lcked
    runtime: node
    plan: free
    # Build: install deps + build the Next.js standalone output
    buildCommand: npm install && npm run build
    # Start: run the standalone Node.js server.
    # HOSTNAME=0.0.0.0 is REQUIRED so Render's proxy can reach the server
    # (otherwise Node listens on localhost and Render gets 502).
    # PORT is set automatically by Render.
    startCommand: HOSTNAME=0.0.0.0 node .next/standalone/server.js
    # Health check — Render pings / to confirm the app is up
    healthCheckPath: /
    # Auto-deploy on push to main
    autoDeploy: true
    # Environment variables
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: 0.0.0.0
      # Optional: Google OAuth (cloud sync)
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false
      # Optional: Firebase service account (cloud sync)
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
