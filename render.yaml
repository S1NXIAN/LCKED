# LCKED — Render Blueprint
# ============================================================
# Deploy LCKED to Render with this blueprint.
#
# Usage:
#   1. Push this repo to GitHub
#   2. In Render: New → Blueprint → select this repo
#   3. Render reads render.yaml and creates the service
#   4. Set environment variables in Render dashboard (see .env.example)
#
# The app is a local-first password manager — all encryption happens in
# the browser (Web Crypto API). The server only serves static files +
# the API routes used for optional Firebase cloud sync.

services:
  - type: web
    name: lcked
    runtime: node
    plan: free
    # Build command: install deps + build the Next.js standalone output
    buildCommand: npm install && npm run build
    # Start command: run the standalone Node.js server (no bun needed)
    startCommand: node .next/standalone/server.js
    # Health check (Render pings this to confirm the app is up)
    healthCheckPath: /
    # Auto-deploy on push to main
    autoDeploy: true
    # Environment variables — set these in the Render dashboard
    envVars:
      # The app runs fully client-side; no server DB needed.
      # Firebase is OPTIONAL — only needed for cloud sync.
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false
        # Required only if you want Google OAuth cloud sync.
        # Set in Render dashboard → Environment.
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
        # Required only if you want cloud sync.
        # Paste the full JSON service account key as a single line.
        # Set in Render dashboard → Environment.
    # Render sets PORT automatically. The standalone server.js
    # listens on process.env.PORT || 3000, so no config needed.
